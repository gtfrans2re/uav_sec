<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Interface de Sécurité UAV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Système de Sécurité UAV</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mt-3">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="row">
            <div class="col-md-6">
                <h3>Attaques</h3>
                <form method="post" action="/launch_attack">
                    <div class="form-group">
                        <select class="form-control" name="attack">
                            <option value="gps_spoofing">GPS Spoofing</option>
                            <option value="dos_attack">Attaque DoS</option>
                            <option value="firmware_hack">Modification Firmware</option>
                        </select>
                    </div>
                    <button class="btn btn-danger btn-block" type="submit">Lancer l'attaque</button>
                </form>
            </div>
            <div class="col-md-6">
                <h3>Défenses</h3>
                <form method="post" action="/launch_defense">
                    <div class="form-group">
                        <select class="form-control" name="defense">
                            <option value="anomaly_detector">Détection d'anomalies</option>
                            <option value="encryption_module">Module de chiffrement</option>
                            <option value="secure_comm">Communication sécurisée</option>
                        </select>
                    </div>
                    <button class="btn btn-success btn-block" type="submit">Activer la défense</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
